name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8.0" "ruff>=0.6" "pydantic>=2.8" httpx pytesseract Pillow

      - name: Lint
        run: ruff check backend eval tests

      - name: Unit tests (no network, no model calls)
        env:
          ANTHROPIC_API_KEY: "dummy-key-ci-only"
        run: pytest tests/ -q

      - name: Regression gate on the committed eval snapshot
        run: python -m eval.regression_check

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t clauseguard:ci .
      - name: Smoke the container in demo mode
        run: |
          docker run -d --name cg -p 8000:8000 -e CLAUSEGUARD_DEMO=1 clauseguard:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/health
          curl -sf -N --max-time 60 http://127.0.0.1:8000/analyze/demo | grep -q "event: complete"
          docker rm -f cg

  # Paid smoke eval on pushes to main only, and only when the secret is
  # configured. 5 scenarios x 2 branches x 1 rep, roughly $0.50.
  eval-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt "pydantic>=2.8"
      - name: Run smoke eval and regression gate
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "no ANTHROPIC_API_KEY secret; skipping"; exit 0; fi
          python -m eval.runners --mode small --branches routed,stripped --yes
          python -m eval.regression_check
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-smoke-report
          path: eval/reports/
          if-no-files-found: ignore
