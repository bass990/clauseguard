name: Eval (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Eval mode: small ($0.50-$1) or full ($5-15)"
        required: true
        default: "small"
        type: choice
        options:
          - small
          - full

jobs:
  run-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install pydantic>=2.8 pytest>=8.0 ruff>=0.6

      - name: Run eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m eval.runners --mode ${{ inputs.mode }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/reports/
          retention-days: 90
